<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Etkinlik Fotoğraf Yükleme</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; }
    label { display:block; margin-top:10px; font-weight:bold; }
    input, button { width:100%; margin-top:4px; padding:8px; box-sizing: border-box; }
    button { margin-top: 16px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Etkinlik Fotoğraf Yükleme</h1>
  <p>Bu alandan etkinlikte çekilen tüm fotoğrafları yükleyebilirsiniz.</p>

  <form action="/admin/upload" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label>Etkinlik ID</label>
    <input type="text" name="event_id" placeholder="deneme" required>

    <label>Fotoğraflar (çoklu seçim)</label>
    <input type="file" name="photos" accept="image/*" multiple required>

    <button type="submit">Fotoğrafları Yükle</button>
  </form>
</body>
</html>
