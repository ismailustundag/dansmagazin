<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Dans Magazin - Fotoğraf Albümleri" }}</title>
  <style>
    :root{
      --bg:#0b1220;
      --bg2:#0e1627;
      --card:#121a2b;
      --text:#e8eefc;
      --muted:rgba(232,238,252,.82);
      --line:rgba(255,255,255,.10);
      --accent:#4f7cff;
      --danger:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:16px 18px;border-bottom:1px solid var(--line);background:var(--bg2);
      gap:12px;flex-wrap:wrap;
    }
    .head-title{font-weight:700}
    .nav{display:flex;gap:10px;flex-wrap:wrap}
    .nav a{
      padding:7px 11px;border-radius:10px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);color:#9fb5ff;text-decoration:none
    }
    .nav a.active{border-color:rgba(159,181,255,.45);background:rgba(159,181,255,.10)}
    .main{max-width:1250px;margin:0 auto;padding:18px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .muted{color:var(--muted)}
    .pill{
      display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
      border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px
    }
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0
    }
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;
      border:1px solid transparent;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer
    }
    .btn.secondary{background:rgba(255,255,255,.04);border-color:var(--line);color:#9fb5ff}
    .btn.danger{background:var(--danger);color:#fff}
    input,select,textarea{
      padding:10px 12px;border-radius:12px;border:1px solid var(--line);outline:none;font-size:13px;
      background:#0f172a;color:var(--text)
    }
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;word-break:break-word}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#9fb5ff}
    @media(max-width:980px){.grid-2,.grid-3{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="head-title">Super Admin - {{ header or "Fotoğraf Albümleri" }}</div>
    <nav class="nav">
      <a href="/admin/users" class="{% if active=='users' %}active{% endif %}">Kullanici Yonetimi</a>
      <a href="/admin/mobile" class="{% if active=='event_management' %}active{% endif %}">Etkinlik Yonetimi</a>
      <a href="/console" class="{% if active=='events' %}active{% endif %}">Fotoğraf Albümleri</a>
      <a href="/logout">Çıkış</a>
    </nav>
  </header>

  <main class="main">
    <div class="topbar">
      <div class="muted" style="font-size:13px;">Admin Console</div>
      {% if owner_email %}<div class="pill">Sahip <b>{{ owner_email }}</b></div>{% endif %}
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
