{% extends "panel_layout.html" %}
{% set active = 'credits' %}
{% set header = 'Kredi Satın Al' %}
{% block content %}
  <div class="card" style="text-align:center;">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px;">Mevcut Kredi</div>
    <div style="font-size:28px;font-weight:800;">{{ photo_credit }}</div>
    <div class="muted" style="margin-top:8px;">1 fotoğraf yükleme = 1 Kredi</div>
  </div>

  <div class="grid-3" style="margin-top:16px;">
    <div class="card" style="text-align:center;">
      <div style="font-size:18px;font-weight:700;">1.000 Kredi</div>
      <div class="muted" style="margin-top:6px;">Yeni başlayanlar için</div>
      <div style="margin-top:12px;"><button class="btn secondary" disabled>Satın Al</button></div>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:18px;font-weight:700;">2.500 Kredi</div>
      <div class="muted" style="margin-top:6px;">Orta düzey ihtiyaçlar</div>
      <div style="margin-top:12px;"><button class="btn secondary" disabled>Satın Al</button></div>
    </div>
    <div class="card" style="text-align:center;">
      <div style="font-size:18px;font-weight:700;">5.000 Kredi</div>
      <div class="muted" style="margin-top:6px;">Tam kapasite</div>
      <div style="margin-top:12px;"><button class="btn secondary" disabled>Satın Al</button></div>
    </div>
  </div>
{% endblock %}
