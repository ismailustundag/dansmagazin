<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Panel</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:#0b1220; color:#e8eefc; margin:0;}
    header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.08); background:#0e1627;}
    a{color:#9fb5ff; text-decoration:none}
    .wrap{max-width:1100px; margin:0 auto; padding:18px;}
    .card{background:#121a2b; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; margin-top:14px;}
    .muted{opacity:.85}
    .tag{display:inline-block; padding:4px 8px; border:1px solid rgba(255,255,255,.14); border-radius:999px; font-size:12px; opacity:.9}
    .btn{display:inline-block; padding:10px 12px; border-radius:12px; border:0; background:#4f7cff; color:white; font-weight:600; cursor:pointer}
  </style>
</head>
<body>
  <header>
    <div>
      <b>Panel</b>
      <span class="muted">— {{ user_email }}</span>
    </div>

    <!-- Menü: Etkinlikler + Çıkış -->
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="/panel/events"><b>Etkinlikler</b></a>
      <a href="/logout">Çıkış</a>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <div class="muted">Rol</div>
      <div style="margin-top:6px;"><span class="tag">{{ role }}</span></div>
    </div>

    <div class="card">
      <div class="muted">Kalan Kredi (Foto)</div>
      <div style="margin-top:6px; font-size:22px;"><b>{{ photo_credit }}</b></div>
      <div class="muted" style="margin-top:8px; font-size:13px;">
        Foto yükleme ekranında kredi otomatik kontrol edilecek ve her yüklemede düşecek.
      </div>
    </div>

    <div class="card">
      <b>Hızlı Başla</b>
      <div class="muted" style="margin-top:6px;">
        Etkinlik oluşturmak / yönetmek için etkinlikler sayfasına geç.
      </div>
      <div style="margin-top:12px;">
        <a class="btn" href="/panel/events">Etkinliklere Git →</a>
      </div>
    </div>
  </div>
</body>
</html>
